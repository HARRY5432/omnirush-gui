# Builds and pushes the OmniRush box images (apps/desktop/box/images/<stack>/Dockerfile,
# the same files as omnirush-cli box/images) for linux/amd64 and linux/arm64: base first,
# the stacks FROM base@digest. Manual only. Published from this public repository, the
# packages are public and linked to it. The refs are the ones the CLI and the app pin
# (src/box/images.json); the job prints each digest.
name: box-images
on:
  workflow_dispatch:
    inputs:
      version:
        description: "image tag, e.g. 2026.10.1"
        required: true
      stacks:
        description: "stacks after base (space separated)"
        default: "go rust java ruby"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: base
        id: base
        run: |
          set -euo pipefail
          ref=ghcr.io/omnirush-ai/box-base:${{ inputs.version }}
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
            --label "org.opencontainers.image.source=$SOURCE" -t "$ref" --metadata-file base.json apps/desktop/box/images/base
          digest=$(jq -r '."containerimage.digest"' base.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "base $ref@$digest" >> pins.txt
      - name: stacks
        run: |
          set -euo pipefail
          for stack in ${{ inputs.stacks }}; do
            ref=ghcr.io/omnirush-ai/box-$stack:${{ inputs.version }}
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
              --label "org.opencontainers.image.source=$SOURCE" \
              --build-arg BASE=ghcr.io/omnirush-ai/box-base@${{ steps.base.outputs.digest }} \
              -t "$ref" --metadata-file "$stack.json" "apps/desktop/box/images/$stack"
            echo "$stack $ref@$(jq -r '."containerimage.digest"' "$stack.json")" >> pins.txt
          done
          cat pins.txt
          cat pins.txt >> "$GITHUB_STEP_SUMMARY"
